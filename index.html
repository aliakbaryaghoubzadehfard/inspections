<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rincovitch Site Inspections</title>
<meta name="description" content="Site inspection reports and register — works offline on this device.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232225" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspections">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Carlito";src:url("fonts/Carlito-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Carlito";src:url("fonts/Carlito-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Carlito";src:url("fonts/Carlito-Italic.woff") format("woff");font-weight:400;font-style:italic;font-display:swap}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:8px;padding:18px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet-card b{font-size:18px}
.sheet-name{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.sheet-btns{display:flex;gap:8px;flex-wrap:wrap}
.sheet-card .hint{margin:0}

#gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.gate-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand-red);border-radius:6px;padding:28px 24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate-logo{height:64px;width:auto}
.gate-card h1{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:var(--charcoal)}
.gate-card p{margin:0;color:var(--muted)}
.gate-err{color:var(--fail)!important}
.gate-foot{font-size:12px;color:var(--muted)!important;border-top:1px solid var(--line);padding-top:10px;width:100%}
.gate-foot b{color:var(--charcoal)}
.signinbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.18)}
</style>
</head>

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--plate)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--plate);border-bottom:1px solid var(--line);box-shadow:0 3px 0 -1px var(--brand-red)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none}
.logo img{display:block;height:38px;width:auto}
.logo i{display:block;width:118px;height:15px;background:var(--wordmark) left center/contain no-repeat}
.rule{width:1px;align-self:stretch;background:var(--line);margin-block:2px}
.ttl{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.ttl b{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--plate-ink);white-space:nowrap}
.ttl span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sync{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;transform:rotate(45deg);background:var(--muted)}
.dot.live{background:var(--pass)}
@media (max-width:440px){.logo i{width:92px;height:12px}.logo img{height:32px}.logo{gap:7px}.brand{gap:9px}#synctext{display:none}.ttl b{font-size:14px}}
nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px 8px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--plate-ink);border-bottom-color:var(--brand-red)}
main{padding-block:16px 24px}
.appfoot{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;padding-block:14px 120px;border-top:1px solid var(--line);margin-top:8px;font-size:12.5px;color:var(--muted);text-align:center}
.appfoot b{color:var(--charcoal);font-weight:700;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:32px}
.about dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0;font-size:15px}
.about dt{color:var(--muted)} .about dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lic{font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;max-height:340px;overflow:auto}
.lic h4{margin:10px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--charcoal)} .lic h4:first-child{margin-top:0}
.lic p{margin:0 0 6px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;color:var(--charcoal)}
h3{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--charcoal);margin:0}
.sec > h3 > :first-child::before,.card > h3 > :first-child::before{content:"";display:inline-block;width:8px;height:8px;margin-right:10px;transform:rotate(45deg) translateY(-2px);background:var(--brand-red)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--steel);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column}
.tile.pass{border-top-color:var(--pass)}.tile.fail{border-top-color:var(--fail)}.tile.open{border-top-color:var(--open)}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile.fail .n{color:var(--fail)} .tile.open .n{color:var(--open)} .tile.pass .n{color:var(--pass)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--charcoal);color:var(--surface);border-color:var(--charcoal)}
.list{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.rec:hover{border-color:var(--muted)}
.rec .no{font-family:var(--f-mono);font-weight:500;font-size:14px;white-space:nowrap}
.rec .what{min-width:0;overflow-wrap:anywhere}
.rec .what b{font-weight:600}
.rec .meta{grid-column:2 / 4;color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere}
.rec .pills{display:flex;gap:4px;justify-self:end}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pass{background:var(--pass-soft);color:var(--pass)} .pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.open{background:var(--open-soft);color:var(--open)} .pill.closed{background:var(--na-soft);color:var(--na)}
.pill.legacy{background:var(--na-soft);color:var(--na);text-transform:none;letter-spacing:0;font-weight:500}
@media (max-width:520px){.rec{grid-template-columns:1fr auto}.rec .what{grid-column:1 / 3;order:3}.rec .meta{grid-column:1 / 3;order:4}}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.sec > h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f > span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--sunken)}
textarea.inp{min-height:88px;resize:vertical}
.inp.mono{font-family:var(--f-mono);font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.fail-t{color:var(--fail)}
.warn{font-size:13px;color:var(--open);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* checklist */
.chk{display:flex;flex-direction:column;gap:8px}
.ci{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci textarea.inp{min-height:40px;resize:none;background:transparent;border-color:transparent;padding:6px 4px}
.ci textarea.inp:focus{border-color:var(--line);background:var(--sunken)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-width:52px;min-height:40px;padding:0 10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-s="A"]{background:var(--pass);color:var(--surface)}
.seg button[aria-pressed="true"][data-s="C"]{background:var(--fail);color:var(--surface)}
.seg button[aria-pressed="true"][data-s="N"]{background:var(--na);color:var(--surface)}
.ci .x{grid-column:2}
@media (max-width:520px){.ci{grid-template-columns:1fr}.ci .seg{justify-self:start}}
/* photos */
/* inspection tracker: drawing viewer + previews */
#trk{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
#trk .tbar,#trk .bbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
#trk .tbar{padding-top:calc(8px + env(safe-area-inset-top,0px))}
#trk .bbar{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#trk .tname{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#trk .stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#DCDCDE;cursor:grab}
#trk .stage.draw{cursor:crosshair}
#trk .layer{position:absolute;left:0;top:0;transform-origin:0 0}
#trk .layer img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#fff}
#trk .layer svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#trk .seg button[aria-pressed="true"]{background:var(--charcoal);color:var(--surface)}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.trkprev{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;line-height:0}
.trkprev img{width:100%;height:auto;display:block}
.trkprev svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{display:flex;flex-direction:column;gap:6px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0}
.shot .img{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:6px;overflow:hidden;background:var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .st{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--surface);color:var(--muted)}
.shot .st.err{color:var(--fail)}
.shot .del{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.shot select,.shot input{min-height:36px;padding:4px 8px;font-size:14px}
.addshot{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.stickybar .wrap{display:flex;gap:8px;padding-block:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.stickybar .msg{flex:1 1 200px;min-width:0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono)}
.sigpad{width:100%;max-width:420px;aspect-ratio:5/2;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
.sigimg{height:56px;background:#fff;border-radius:6px;padding:4px;border:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--fail-soft);color:var(--fail);border-radius:8px;padding:8px 10px;font-size:14px}
.typecard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.typecard b{font-weight:600}
.banner{background:var(--open-soft);color:var(--open);border-radius:8px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.rec,.btn{transition:border-color .15s}}

<script>/* Inspection report + register engine.
   Fills the master Word template and writes rows into the register workbook.
   Works in the browser (global JSZip) and in Node (require('jszip')) for testing. */
(function (root) {
  'use strict';
  /* resolved at call time: the library may arrive after this file runs (fallback loader in the page) */
  function zipLib() {
    const z = root.JSZip || (typeof require === 'function' && typeof window === 'undefined' ? require('jszip') : null);
    if (!z) throw new Error('The file builder (JSZip) did not load. Check your connection and try again.');
    return z;
  }

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fill = (tpl, map) => tpl.replace(/\{\{([A-Z_]+)\}\}/g, (m, k) => (k in map ? map[k] : m));

  const EMU_IN = 914400;
  const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const NS_PIC = 'http://schemas.openxmlformats.org/drawingml/2006/picture';

  function fitEmu(w, h, maxWin, maxHin) {
    const s = Math.min(maxWin / w, maxHin / h);
    return [Math.round(w * s * EMU_IN), Math.round(h * s * EMU_IN)];
  }

  function drawingRun(rid, id, cx, cy, name) {
    return '<w:r><w:rPr><w:noProof/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
      `<wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/>` +
      `<wp:docPr id="${id}" name="${esc(name)}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="${NS_A}" noChangeAspect="1"/></wp:cNvGraphicFramePr>` +
      `<a:graphic xmlns:a="${NS_A}"><a:graphicData uri="${NS_PIC}"><pic:pic xmlns:pic="${NS_PIC}">` +
      `<pic:nvPicPr><pic:cNvPr id="${id}" name="${esc(name)}"/><pic:cNvPicPr/></pic:nvPicPr>` +
      `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
      '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
  }

  const SYM = '<w:rPr><w:rFonts w:ascii="Segoe UI Symbol" w:hAnsi="Segoe UI Symbol" w:cs="Segoe UI Symbol"/><w:bCs/></w:rPr>';
  const SYM_ON = '<w:rPr><w:rFonts w:ascii="Segoe UI Symbol" w:hAnsi="Segoe UI Symbol" w:cs="Segoe UI Symbol"/><w:b/><w:bCs/></w:rPr>';
  const run = (text, rpr) => `<w:r>${rpr || ''}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;

  /* SECTIONS: order and page layout of photo groups */
  const SECTIONS = [
    { key: 'site', heading: 'Site photos', maxW: 6.2, maxH: 3.7 },
    { key: 'shop', heading: 'Shop drawings', maxW: 6.4, maxH: 7.9 },
    { key: 'plan', heading: 'Marking plan', maxW: 6.4, maxH: 7.6, note: true },
  ];

  /**
   * data: {title,to,from,reportNo,date,job,idLabel,ids,extra:[{label,value}],
   *        stage:{options:[],selected,other}|null, workArea,status,
   *        checklist:[{item,s:'A'|'C'|'N'|''}], comments:[], action}
   * photos: [{bytes:Uint8Array, w, h, ext:'jpeg'|'png', caption, section}]
   * signature: {bytes, w, h} | null
   */
  async function buildReport(templateBuf, parts, data, photos, signature) {
    const zip = await zipLib().loadAsync(templateBuf);
    let doc = await zip.file('word/document.xml').async('string');
    let rels = await zip.file('word/_rels/document.xml.rels').async('string');

    // header rows
    const extra = (data.extra || []).filter((r) => r && (r.always || String(r.value || '').trim()))
      .map((r) => fill(parts.row_info, { LABEL: esc(r.label), VALUE: esc(r.value) })).join('');
    let stageRow = '';
    if (data.stage && data.stage.options && data.stage.options.length) {
      let runs = run('Stage observed: ', '<w:rPr><w:b/></w:rPr>');
      data.stage.options.forEach((opt, i) => {
        const on = data.stage.selected === opt;
        let label = opt;
        if (/^other/i.test(opt)) label = on && data.stage.other ? `Other: ${data.stage.other}` : 'Other: ______';

        const name = `photo${n}.${ext}`;

      DATE: esc(data.date), JOB: esc(data.job), ID_LABEL: esc(data.idLabel || 'Element Identification'),
      IDS: esc(data.ids), EXTRA_ROWS: extra, STAGE_ROW: stageRow, WORK_AREA: esc(data.workArea),

  /* ---------------- register ---------------- */
  const COLS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P'];
  const FIELDS = ['reportNo', 'date', 'weekEnding', 'workArea', 'assetIds', 'inspType', 'description', 'result',

    if (isDate) {

    }

    const cells = COLS.map((c, i) => {
      const f = FIELDS[i];
      const isDate = f === 'date' || f === 'weekEnding' || f === 'closeOut';
      return cellXml(c, r, rec[f], isDate, lines > 1);

  }

    COLS.map((c) => `<c r="${c}${r}" s="${STYLE[c] != null ? STYLE[c] : 2}"/>`).join('') + '</row>';

  /** records: register rows in display order. Returns xlsx bytes. */
  async function buildRegister(baseBuf, records) {
    const zip = await zipLib().loadAsync(baseBuf);
    const path = 'xl/worksheets/sheet2.xml';
    let s = await zip.file(path).async('string');
    const start = s.indexOf('<sheetData>') + '<sheetData>'.length;
    const end = s.indexOf('</sheetData>');

    const keep = [];

      const r = +m[1];

  /** Read register rows out of an uploaded workbook (inline or shared strings). */
  async function readRegister(buf) {
    const zip = await zipLib().loadAsync(buf);

    const wbRels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    const sm = /<sheet [^>]*name="Inspection Register"[^>]*r:id="([^"]+)"/.exec(wb);
    if (!sm) throw new Error('This workbook has no "Inspection Register" sheet.');

      new RegExp(`<Relationship [^>]*Target="([^"]+)"[^>]*Id="${sm[1]}"`).exec(wbRels);

    }
    const s = await zip.file(sheetPath).async('string');
    const rows = [];
    const rowRe = /<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g; let m;
    while ((m = rowRe.exec(s))) {
      const r = +m[1]; if (r < 6) continue;
      const rec = {}; let any = false;
      const cRe = /<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
      while ((c = cRe.exec(m[2]))) {
        const i = COLS.indexOf(c[1]); if (i < 0 || !c[3]) continue;
        const type = (/t="(\w+)"/.exec(c[2]) || [])[1];
        let v;
        if (type === 's') v = sst[+(/<v>([^<]*)<\/v>/.exec(c[3]) || [])[1]];
        else if (type === 'inlineStr') v = unxml((c[3].match(/<t[^>]*>[\s\S]*?<\/t>/g) || []).map((q) => q.replace(/<[^>]+>/g, '')).join(''));
        else { const vv = (/<v>([^<]*)<\/v>/.exec(c[3]) || [])[1]; v = vv; }
        if (v == null || v === '') continue;
        const f = FIELDS[i];
        if ((f === 'date' || f === 'weekEnding' || f === 'closeOut') && /^\d+(\.\d+)?$/.test(v)) {
          const d = new Date(Date.UTC(1899, 11, 30) + Math.round(+v) * 86400000);
          v = d.toISOString().slice(0, 10);
        }

    }

  }

    return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

})(typeof window !== 'undefined' ? window : globalThis);

<script>/* Minimal PDF writer + Rincovitch inspection report layout (same content/order as the Word report).

(function (root) {

    0x2039: 0x8B, 0x152: 0x8C, 0x17D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x2DC: 0x98,
    0x2122: 0x99, 0x161: 0x9A, 0x203A: 0x9B, 0x153: 0x9C, 0x17E: 0x9E, 0x178: 0x9F, 0x2212: 0x2D, 0x2010: 0x2D, 0x2011: 0x2D, 0xA0: 0x20 };

      const out = [];
      String(s == null ? '' : s).split('\n').forEach((para) => {
        const words = para.split(/\s+/).filter((w) => w.length); let line = '';
        if (!words.length) { out.push(''); return; }

          const t = line ? line + ' ' + w : w;

          while (this.widthMM(line, f, size) > maxw && line.length > 1) { // hard-break very long tokens
            let k = line.length - 1; while (k > 1 && this.widthMM(line.slice(0, k), f, size) > maxw) k--;
            out.push(line.slice(0, k)); line = line.slice(k);

        out.push(line);
      });
      return out;
    }
    color(c, fill) { const [r, g, b] = c.map((v) => (v / 255).toFixed(3)); return `${r} ${g} ${b} ${fill ? 'rg' : 'RG'}`; }
    text(x, y, s, f = 'R', size = 9, col = [0, 0, 0]) {
      const codes = toCodes(s); if (!codes.length) return;

      this.cur.push(`BT ${this.color(col, true)} /F${f} ${size} Tf ${(x * MM).toFixed(2)} ${((PH - y) * MM).toFixed(2)} Td (${str}) Tj ET`);
    }
    line(x1, y1, x2, y2, w = 0.25, dash = null, col = [0, 0, 0]) {
      this.cur.push(`q ${this.color(col)} ${(w * MM).toFixed(2)} w ${dash ? `[${dash.map((d) => (d * MM).toFixed(2)).join(' ')}] 0 d` : ''} ${(x1 * MM).toFixed(2)} ${((PH - y1) * MM).toFixed(2)} m ${(x2 * MM).toFixed(2)} ${((PH - y2) * MM).toFixed(2)} l S Q`);
    }

  /* ---------- report layout (mm, origin top-left) ---------- */
  const ML = 19, MR = 191, CW = MR - ML, TOP = 42, BOTTOM = 266;
  const NOTE1 = 'This ‘inspection report’ represents a thorough but not all encompassing review of the elements sighted.  It is only a part of the total quality assurance required of the builder.';
  const NOTE2 = 'It is the responsibility of the builder to ensure that any corrective actions are carried out.  The structural engineer, at his discretion, may or may not re-inspect.';
  const SECTIONS = [
    { key: 'site', heading: 'Site photos:', maxW: 157.5, maxH: 94 },
    { key: 'shop', heading: 'Shop drawings:', maxW: 162.5, maxH: 200 },
    { key: 'plan', heading: 'Marking plan:', maxW: 162.5, maxH: 190, note: true },

  /**

  function buildReportPdf(widths, data, photos, signature, logo) {
    const pdf = new PDF(widths);

      [[NOTE1, '1.'], [NOTE2, '2.']].forEach(([t, n]) => {
        const lines = pdf.wrap(t, 'R', 6.8, MR - ML - 15);

    const newPage = () => { pdf.addPage(); decorate(); y = TOP; };
    const ensure = (h) => { if (y + h > BOTTOM) { newPage(); y = 20; } };
    if (logo) logo.id = pdf.addJpeg(logo.jpeg, logo.w, logo.h);

    pdf.addPage(); decorate();
    pdf.text(ML, 20, 'SITE INSPECTION REPORT', 'B', 14);
    pdf.text(ML, 27.5, 'FOR ' + (data.title || ''), 'B', 14);

    const SIZE = 8.5, COL2 = 125;
    const field = (x, yy, label, value, maxw) => {
      pdf.text(x, yy, label, 'B', SIZE);
      const lw = pdf.widthMM(label + ' ', 'B', SIZE);
      const lines = pdf.wrap(value || '', 'R', SIZE, maxw - lw);
      lines.forEach((l, i) => pdf.text(x + lw, yy + i * 3.8, l, 'R', SIZE));

      const n1 = field(ML, y + 5, left[0] + ':', left[1], leftMax);
      let n2 = 1;
      if (right) n2 = opts.status ? 1 : field(right[2] || COL2, y + 5, right[0] + ':', right[1], MR - (right[2] || COL2));
      if (opts.status) {
        const x = right[2]; pdf.text(x, y + 5, right[0] + ':', 'B', SIZE);
        const lw = pdf.widthMM(right[0] + ': ', 'B', SIZE), st = String(right[1] || '').toLowerCase();
        if (st) {
          const tw = pdf.widthMM(st, 'B', SIZE);

    row(['Report Number', data.reportNo], ['Date', data.date]);
    row(['Job', data.job]);
    row([data.idLabel || 'Element Identification', data.ids]);
    (data.extra || []).filter((r) => r && (r.always || String(r.value || '').trim())).forEach((r) => row([r.label, r.value]));
    if (data.stage && data.stage.options && data.stage.options.length) {
      let x = ML; const yy = y + 5;
      pdf.text(x, yy, 'Stage observed:', 'B', SIZE); x += pdf.widthMM('Stage observed:  ', 'B', SIZE);
      data.stage.options.forEach((opt) => {
        const on = data.stage.selected === opt;
        let label = opt; if (/^other/i.test(opt)) label = on && data.stage.other ? 'Other: ' + data.stage.other : 'Other: ______';

      lines.forEach((l, k) => pdf.text(xs[i] + (cols[i] - pdf.widthMM(l, 'B', 6.8)) / 2, y0 + k * 3.2, l, 'B', 6.8));

      lines.forEach((l, k) => pdf.text(ML + 1.5, y + 3.3 + k * 3.3, l, 'R', 8));
      const col = { A: 1, C: 2, N: 3 }[c.s];

      const s = Math.min((bw - 4) / signature.w, (bh - 3) / signature.h);

        const id = pdf.addJpeg(p.jpeg, p.w, p.h);
        pdf.image(id, (PW - w) / 2, y, w, h); y += h + 3;
        cap.forEach((l) => { pdf.text((PW - pdf.widthMM(l, 'I', 7.5)) / 2, y + 1.5, l, 'I', 7.5); y += 3.4; });
        y += 4;
      });
      if (sec.note) {
        const lines = pdf.wrap('Note: Elements highlighted in yellow are covered by this inspection report. Elements highlighted in red were inspected previously.', 'I', 10, CW);
        if (y + lines.length * 4.5 > BOTTOM + 4) { newPage(); y = 34; }

/* ---------- photos: shrink on the phone, then upload ---------- */
async function shrink(file, maxDim = 2560, q = 0.88) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width, h0 = bmp.height, s = Math.min(1, maxDim / Math.max(w0, h0));
  const w = Math.round(w0 * s), hh = Math.round(h0 * s);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, hh); cx.drawImage(bmp, 0, 0, w, hh);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', q));
  return { blob, w, h: hh };
}
async function addPhotos(files, input) {
  const f = S.form; const list = [...(files || [])]; if (input) input.value = '';
  for (const file of list) {
    let shot;
    try { shot = await shrink(file); } catch (e) { toast('Could not read that image'); continue; }
    const key = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
    S.localBlobs.set(key, { blob: shot.blob, url: URL.createObjectURL(shot.blob) });
    const p = { local: key, w: shot.w, h: shot.h, ext: 'jpeg', section: 'site', caption: '', state: S.assets ? 'uploading' : 'local' };
    f.photos.push(p); redrawPhotos();
    if (S.assets) uploadPhoto(p);
  }
}
async function uploadPhoto(p) {

  p.state = 'uploading'; if (S.view === 'form') redrawPhotos();
  try {
    const r = await S.assets.upload(lb.blob, { type: 'image/jpeg' });
    p.asset = r.id; p.state = '';
  } catch (e) { p.state = 'error'; if (e && e.code === 'quota_or_state') toast('Photo storage is full — remove old photos or ask the owner.'); }
  if (S.view === 'form' && S.form && S.form.photos.includes(p)) { redrawPhotos(); saveDraft(); }
}

/* JSZip comes from a CDN; on a weak or filtered mobile connection the first try can fail, so load it again on demand */
const JSZIP_SRC = [...(window.__standalone ? ['lib/jszip.min.js'] : []), 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js', 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'];

    throw new Error('Could not download the file builder. Check your signal and try again.');

}
const blobURL = (id) => (window.__standalone ? window.__standalone.blobURL(id) : '/_blob/' + id);
const assetBytes = (id) => (window.__standalone ? window.__standalone.blobBytes(id) : fetchBytes('/_blob/' + id));

  catch (e) { if (e && e.code !== 'declined') toast('Download failed: ' + (e.message || e.code)); return false; }
}

/* ---------- package: <ID>.zip with Report/ (docx + pdf, 6 random site photos) and Photos/ (all) ---------- */
const safeName = (s) => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001F]/g, '').replace(/\s+/g, ' ').trim();
async function toJpeg(bytes, mime) {
  const bmp = await createImageBitmap(new Blob([bytes], { type: mime || 'image/png' }));
  const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.92));
  return { jpeg: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height };
}
function pickReportPhotos(list, n = 6) {
  const idx = list.map((p, i) => i).filter((i) => (list[i].section || 'site') === 'site');
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const keep = new Set(idx.slice(0, n));
  return list.filter((p, i) => (p.section || 'site') !== 'site' || keep.has(i)); // drawings always go in
}
async function photoBytes(ph) {
  if (ph.local && S.localBlobs.get(ph.local)) return new Uint8Array(await S.localBlobs.get(ph.local).blob.arrayBuffer());
  if (ph.asset) return assetBytes(ph.asset);
  return null;
}
function reportData(r) {
  return { title: r.title || r.typeName || '', to: r.to, from: r.from, reportNo: r.reportNo, date: fmtAU(r.date), job: r.job || S.project.job,
    idLabel: r.idLabel, ids: r.assetIds, extra: [{ label: 'Location / Level', value: r.location }], stage: r.stage, workArea: r.workArea,

}
const reportBaseName = (r) => safeName(`Site Inspection Report - ${r.reportNo} - ${r.typeName || ''}${r.assetIds && r.assetIds.length < 40 ? ' - ' + r.assetIds : ''} - ${fmtShort(r.date)}`);
async function downloadPackage(r, btn) {

    const { all, docx, pdf, trk, base } = await buildReportFiles(r, step);
    step('Zipping…');

    const rep = zip.folder('Report'); rep.file(base + '.docx', docx); rep.file(base + '.pdf', pdf);
    if (trk.length) { const tf = zip.folder('Tracker'); trk.forEach((x) => tf.file(x.name, x.bytes)); }
    const ph = zip.folder('Photos');

    const bytes = await zip.generateAsync({ type: 'uint8array', compression: 'STORE' });
    const zname = safeName(r.reportNo) + '.zip';
    if (window.__standalone && window.__standalone.filePackage) {

  } catch (e) { console.error(e); toast('Could not build the package: ' + (e.message || e)); }

const SEC_NAME = { site: 'Site photo', shop: 'Shop drawing', plan: 'Marking plan' };
const photoFileName = (r, p, i) => safeName(`${r.reportNo} - ${String(i + 1).padStart(2, '0')} - ${SEC_NAME[p.section || 'site']}${p.caption ? ' - ' + p.caption.slice(0, 60) : ''}`) + '.jpg';
/* Word + PDF report (6 random site photos) and trackers for one record. Kept for the session so an email sends the same report as the package. */
const builtFiles = new Map();
async function buildReportFiles(r, step = () => {}) {
  const key = r.id ? [r.id, r.updatedAt || '', TRK_ON ? Object.values(S.insp).reduce((n, x) => n + (x.marks || []).length, 0) : 0].join('|') : null;
  if (key && builtFiles.has(key)) return builtFiles.get(key);
  {

    const chosen = pickReportPhotos(all, 6);

      chosen.map((p) => ({ bytes: p.bytes, w: p.w, h: p.h, ext: p.ext || 'jpeg', section: p.section, caption: p.caption })),

async function emailAttachments(r, step) {
  const { all, docx, pdf, trk, base } = await buildReportFiles(r, step);
  const sel = (id) => { const x = $('#' + id); return !!(x && x.checked); };
  const files = [];
  if (sel('em-pdf')) files.push({ name: base + '.pdf', type: 'application/pdf', bytes: pdf });
  if (sel('em-docx')) files.push({ name: base + '.docx', type: DOCX_MIME, bytes: docx });
  if (sel('em-trk')) trk.forEach((x) => files.push({ name: x.name, type: 'application/pdf', bytes: x.bytes }));
  if (sel('em-photos') && all.length) {
    step('Zipping photos…'); const z = new JSZip(); all.forEach((p, i) => z.file(photoFileName(r, p, i), p.bytes));
    files.push({ name: safeName(r.reportNo) + ' - Photos.zip', type: 'application/zip', bytes: await z.generateAsync({ type: 'uint8array', compression: 'STORE' }) });
  }
  return files;
}
function readEmailForm() {
  const to = addrList($('#em-to').value), cc = addrList($('#em-cc').value);
  const bad = [...to, ...cc].filter((x) => !parseAddr(x));
  if (!to.length) return { error: 'Add at least one email address in To' };
  if (bad.length) return { error: 'Check this address: ' + bad[0] };
  return { to: to.map(parseAddr), cc: cc.map(parseAddr), subject: $('#em-subj').value.trim() || 'Site inspection report', text: $('#em-body').value };
}
const mb = (n) => (n / 1048576).toFixed(1) + ' MB';
function bindEmail(r) {
  const SA = window.__standalone;
  const msg = (t) => { const m = $('#em-msg'); if (m) m.innerHTML = t; };
  $('#em-cancel').onclick = () => { $('#emailbox').innerHTML = ''; };
  $('#em-to').addEventListener('change', () => { const b = $('#em-body'); if (b && !b.dataset.touched) b.value = defaultEmailBody(r, $('#em-to').value); });
  $('#em-body').addEventListener('input', (e) => { e.target.dataset.touched = '1'; });
  const busy = (btn, on, label) => { $$('#emailcard .btn').forEach((b) => { b.disabled = on; }); if (label != null) btn.textContent = label; };
  if ($('#em-send')) $('#em-send').onclick = async () => {
    const f = readEmailForm(); if (f.error) { toast(f.error); return; }
    const btn = $('#em-send'), label = btn.textContent; busy(btn, true);
    try {
      const files = await emailAttachments(r, (t) => { btn.textContent = t; });
      const total = files.reduce((n, x) => n + x.bytes.length, 0);
      if (total > 25 * 1048576) { msg(`The attachments are ${mb(total)} — too large for email. Untick the photos or the Word report.`); return; }
      btn.textContent = 'Queuing…';
      const res = await SA.queueMail({ rid: r.id, to: f.to, cc: f.cc, subject: f.subject, html: bodyHtml(f.text), files });
      if (res.needConsent) {
        msg(`<div class="warn" style="display:block">Your email (${mb(total)}) is saved on this phone. To send it from your Outlook, the app needs your permission to send email as you — a one-time Microsoft prompt.
          <div class="row" style="margin-top:8px"><button class="btn small primary" id="em-allow">Allow and send</button></div></div>`);
        $('#em-allow').onclick = () => { try { sessionStorage.setItem('insp.reopen', r.id); } catch (e) {} SA.allowMail(); };
        return;
      }
      toast(res.online ? `Sending to ${f.to.join(', ')}…` : 'Saved — the email goes as soon as you have signal', 4500);
      $('#emailbox').innerHTML = ''; paintEmailLog(r);
    } catch (e) { console.error(e); msg('Could not prepare the email: ' + h(e.message || e)); }
    finally { if (document.body.contains(btn)) { busy(btn, false, label); } }
  };
  $('#em-share').onclick = async () => {
    const f = readEmailForm(); if (f.error && !/at least one/.test(f.error)) { toast(f.error); return; }
    const btn = $('#em-share'), label = btn.textContent; busy(btn, true);
    let files;
    try { files = await emailAttachments(r, (t) => { btn.textContent = t; }); }
    catch (e) { msg('Could not prepare the files: ' + h(e.message || e)); busy(btn, false, label); return; }
    busy(btn, false, label);
    const fl = files.map((x) => new File([x.bytes], x.name, { type: x.type }));
    const sub = (f.subject || $('#em-subj').value), text = $('#em-body').value;
    const canShare = navigator.canShare && navigator.share && (() => { try { return navigator.canShare({ files: fl }); } catch (e) { return false; } })();
    // the share sheet needs a fresh tap, so offer a second button once the files are ready
    msg(`<div class="row" style="margin-top:4px">${canShare ? '<button class="btn small primary" id="em-open">Open mail app with the files</button>' : '<a class="btn small primary" id="em-open">Open my mail app</a>'}<span class="hint">${files.length} file${files.length === 1 ? '' : 's'} · ${mb(files.reduce((n, x) => n + x.bytes.length, 0))}</span></div>
      ${canShare ? '<p class="hint" style="margin:6px 0 0">Choose Mail or Outlook in the share sheet. Some mail apps ignore the subject — check it before sending.</p>' : '<p class="hint" style="margin:6px 0 0">This device cannot hand files to the mail app, so the files are downloaded — attach them to the email that opens.</p>'}`);
    if (canShare) $('#em-open').onclick = async () => { try { await navigator.share({ files: fl, title: sub, text }); } catch (e) { if (e && e.name !== 'AbortError') toast('Could not open the share sheet: ' + (e.message || e)); } };
    else {
      const a = $('#em-open'); a.href = `mailto:${encodeURIComponent((f.to || []).join(','))}?${new URLSearchParams({ ...(f.cc && f.cc.length ? { cc: f.cc.join(',') } : {}), subject: sub, body: text }).toString().replace(/\+/g, '%20')}`;
      a.onclick = async () => { for (const x of files) await saveFile(x.name, x.bytes, x.type); };
    }
  };
}

async function paintEmailLog(r) {
  const box = $('#emlog'); if (!box) return;

async function exportRegister() {
  const btn = $('#xlsxbtn'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Building register…';
  try {
    const recs = Object.values(S.insp).sort((a, b) => (numOf(a.reportNo) - numOf(b.reportNo)) || String(a.date || '').localeCompare(b.date || '') || String(a.createdAt || '').localeCompare(b.createdAt || ''))
      .map((r) => ({ ...r, closeOut: r.closeOut || '', action: r.action || '' }));
    const base = S.regBase || b64ToBytes(TPL.register);
    await ensureZip();
    const bytes = await InspEngine.buildRegister(base, recs);
    const name = `${(S.project.prefix || 'MEL03-').replace(/-?Insp-?$/i, '')}-Inspection-Register-${fmtShort(todayISO())}.xlsx`.replace(/^-/, '');
    if (await saveFile(name, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')) toast(`Register saved with ${recs.length} rows`);
  } catch (e) { console.error(e); toast('Could not build the register: ' + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = label; }
}
const regKey = (r) => [String(r.reportNo || '').trim().toLowerCase(), String(r.assetIds || '').replace(/\s+/g, '').toLowerCase()].join('|');
async function importRegister(e) {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  if (!S.db) { toast('The shared register is not connected in this view.'); return; }
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    await ensureZip();
    const rows = await InspEngine.readRegister(buf);
    const have = new Set(Object.values(S.insp).map(regKey));
    const fresh = rows.filter((r) => !have.has(regKey(r)));
    for (const r of fresh) {
      const rec = { ...r, source: 'register', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; delete rec.row;
      await S.db.collection('inspections').doc().set(rec);
    }
    S.regBase = buf;
    toast(fresh.length ? `Added ${fresh.length} row${fresh.length > 1 ? 's' : ''} from ${file.name}. Exports this session use that workbook's layout.` : `No new rows in ${file.name} — the register already has all ${rows.length}.`, 5000);
  } catch (err) { toast('Could not read that workbook: ' + (err.message || err)); }
}

function openSigPad(k) {
  const i = S.project.inspectors[k];
  $('#sigarea').innerHTML = `<div class="card stack"><b>Signature for ${h(i.name)}</b><canvas class="sigpad" id="pad" width="1000" height="400"></canvas>
    <div class="row"><button class="btn small" id="padclear">Clear</button><span class="btn small filebtn">Upload image<input type="file" id="sigfile" accept="image/png,image/jpeg"></span><span class="grow"></span><button class="btn small primary" id="padsave">Save signature</button></div>
    <p class="hint" style="margin:0">Sign with a finger or mouse, or upload a scan (PNG with a white or clear background works best).</p></div>`;
  const cv = $('#pad'), cx = cv.getContext('2d'); cx.lineWidth = 6; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#111';
  let drawing = false, inked = false, last = null;
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = (e) => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => { if (!drawing) return; const p = pt(e); cx.beginPath(); cx.moveTo(...last); cx.lineTo(...p); cx.stroke(); last = p; inked = true; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };

/* ---------- inspection trackers: mark on a drawing (PDF) where each inspection was done ----------
   Drawings live in the shared folder (original PDF + a picture of the page for marking on a phone).
   Marks are stored in each inspection record in PDF coordinates, so the shared tracker PDF is always
   rebuilt from the records: every inspection adds its own coloured line / box with its date. */
const TRK_ON = !!window.__standalone;
const TRK_COLORS = ['#39D353', '#2F6BFF', '#F2D600', '#FF8A00', '#D940FF', '#00C2C7', '#FF3B6B'];

  if (extra) recs.push(extra);
  return recs.filter((r) => (r.marks || []).some((m) => m.t === tid))
    .sort((a, b) => String(a.date || '').localeCompare(b.date || '') || numOf(a.reportNo) - numOf(b.reportNo))

}

/* --- full-screen drawing viewer (pan / pinch-zoom; line and box tools when marking) --- */
let TV = null;

    draft: [], box: null, s: 1, x: 0, y: 0, ptr: new Map(), pinch: null };
  const el = document.createElement('div'); el.id = 'trk'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Drawing: ' + t.name);
  const n = new Set(all.map((m) => m.rid)).size;

      <span class="tname">${h(t.name)}</span>
      ${editing ? `<span class="seg" role="group" aria-label="Tool">${[['pan', 'Move'], ['line', 'Line'], ['box', 'Box']].map(([k, l]) => `<button type="button" data-tool="${k}" aria-pressed="${TV.mode === k}">${l}</button>`).join('')}</span>` : ''}
      <button type="button" class="btn small" id="tzout" aria-label="Zoom out">−</button><button type="button" class="btn small" id="tzin" aria-label="Zoom in">+</button><button type="button" class="btn small" id="tfit">Fit</button>
      <button type="button" class="btn small primary" id="tdone">${editing ? 'Done' : 'Close'}</button></div>
    <div class="stage" id="tstage"><div class="layer" id="tlayer"><img id="timg" src="${h(blobURL(t.imgAsset))}" width="${t.imgW}" height="${t.imgH}" alt=""><svg id="tsvg" width="${t.imgW}" height="${t.imgH}" viewBox="0 0 ${t.imgW} ${t.imgH}"></svg></div></div>
    <div class="bbar">${editing
      ? `${TRK_COLORS.map((c) => `<button type="button" class="swatch" data-col="${c}" style="background:${c}" aria-label="Colour ${c}" aria-pressed="${c === TV.color}"></button>`).join('')}
        <button type="button" class="btn small primary" id="tfinish" hidden>Finish line</button><button type="button" class="btn small" id="tundo">Undo</button><button type="button" class="btn small ghost" id="tclear">Clear my marks</button>
        <span class="hint" id="thint" style="flex-basis:100%"></span>`
      : `<span class="hint grow">${n} inspection${n === 1 ? '' : 's'} marked on this drawing</span><button type="button" class="btn small" id="tpdf">Download tracker PDF</button>`}</div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';

  const apply = () => { $('#tlayer').style.transform = `translate(${TV.x}px,${TV.y}px) scale(${TV.s})`; };
  const fit = () => { const r = stage.getBoundingClientRect(); TV.s = Math.min(r.width / t.imgW, r.height / t.imgH); TV.min = TV.s * 0.7; TV.x = (r.width - t.imgW * TV.s) / 2; TV.y = (r.height - t.imgH * TV.s) / 2; apply(); };

  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = local(e); zoomAt(Math.exp(-e.deltaY * 0.0015), x, y); }, { passive: false });
  $('#tzin').onclick = () => zoomAt(1.5, ...centre());
  $('#tzout').onclick = () => zoomAt(1 / 1.5, ...centre());
  $('#tfit').onclick = fit;
  window.addEventListener('resize', fit);
  if (editing) {
    $$('#trk [data-tool]').forEach((b) => { b.onclick = () => { if (TV.mode === 'line') finishLine(); TV.mode = b.dataset.tool; $$('#trk [data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(); }; });
    $$('#trk [data-col]').forEach((b) => { b.onclick = () => { TV.color = b.dataset.col; TV.mine.forEach((m) => { m.c = TV.color; }); $$('#trk [data-col]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(); }; });
    $('#tfinish').onclick = finishLine;
    $('#tundo').onclick = () => { if (TV.draft.length) TV.draft.pop(); else TV.mine.pop(); draw(); };
    $('#tclear').onclick = () => { TV.draft = []; TV.mine = []; draw(); };
    $('#tdone').onclick = () => {
      finishLine();
      const f = S.form; f.marks = (f.marks || []).filter((m) => m.t !== t.id).concat(TV.mine); f.trackerId = t.id;
      const n2 = TV.mine.length; close(); saveDraft(); redrawTrkSec();
      toast(n2 ? `${n2} mark${n2 > 1 ? 's' : ''} on ${t.name} — they're saved with the inspection when you tap Save` : 'No marks on this drawing');
    };
  } else {
    $('#tdone').onclick = close;
    $('#tpdf').onclick = () => downloadTracker(t.id, $('#tpdf'));
  }
  requestAnimationFrame(() => { fit(); draw(); });
}

/* --- the tracker PDF: original drawing + every inspection's marks and dates --- */
let pdfLibLoading = null;
function ensurePdfLib() {
  if (window.PDFLib) return Promise.resolve();
  if (!pdfLibLoading) pdfLibLoading = loadScript('lib/pdf-lib.min.js', 30000).then(() => { if (!window.PDFLib) throw new Error('missing'); })
    .catch(() => { pdfLibLoading = null; throw new Error('The PDF tool could not be loaded. Open the app once with signal and try again.'); });
  return pdfLibLoading;
}
async function buildTrackerPdf(t, extra) {
  await ensurePdfLib();
  const { PDFDocument, StandardFonts, rgb, degrees, LineCapStyle } = window.PDFLib;
  const doc = await PDFDocument.load(await assetBytes(t.pdfAsset), { ignoreEncryption: true, updateMetadata: false });
  const page = doc.getPage(t.page || 0);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold), reg = await doc.embedFont(StandardFonts.Helvetica);
  const col = (c) => { const n = parseInt(String(c || TRK_COLORS[0]).slice(1), 16); return rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
  const red = col(TRK_RED), W = trkW(t), sc = trkScale(t), rot = degrees(t.rotate || 0), fs = W * 1.1;
  const marks = trackerMarks(t.id, extra);
  for (const m of marks) {
    if (m.k === 'box') {
      const xs = m.p.map((p) => p[0]), ys = m.p.map((p) => p[1]);
      page.drawRectangle({ x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys),
        color: col(m.c), opacity: 0.3, borderColor: col(m.c), borderWidth: W * 0.35, borderOpacity: 0.95 });
    } else {
      page.drawSvgPath(m.p.map((p, i) => `${i ? 'L' : 'M'} ${p[0]} ${-p[1]}`).join(' '), { x: 0, y: 0, borderColor: col(m.c), borderWidth: W, borderOpacity: 0.75, borderLineCap: LineCapStyle.Round });
    }
    if (m.l) {
      const li = toImg(t, m.l), p2 = toPdf(t, [li[0], li[1] + fs * 0.95 * sc]);
      page.drawText(fmtDots(m.date), { x: m.l[0], y: m.l[1], size: fs, font: bold, color: red, rotate: rot });
      if (m.reportNo) page.drawText(String(m.reportNo), { x: p2[0], y: p2[1], size: fs * 0.6, font: reg, color: red, rotate: rot });
    }
  }
  const n = new Set(marks.map((m) => m.rid)).size;
  const st = toPdf(t, [t.imgW * 0.012, t.imgH * 0.992]);
  page.drawText(`Inspection tracker — ${n} inspection${n === 1 ? '' : 's'} marked — updated ${fmtAU(todayISO())}`, { x: st[0], y: st[1], size: W * 0.7, font: reg, color: red, rotate: rot });
  return doc.save({ useObjectStreams: true });
}
const trackerFileName = (t) => safeName(t.name) + ' - Inspection Tracker.pdf';
async function downloadTracker(tid, btn) {
  const t = trackerById(tid); if (!t) return;
  const label = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = 'Building tracker…'; }
  try { const bytes = await buildTrackerPdf(t, null); await saveFile(trackerFileName(t), bytes, 'application/pdf'); }
  catch (e) { console.error(e); toast('Could not build the tracker: ' + (e.message || e)); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; } }
}

/* --- adding drawings (Templates tab) --- */
let pdfjsLoading = null;
function ensurePdfJs() {
  if (!pdfjsLoading) pdfjsLoading = (async () => {
    const base = new URL('lib/pdfjs/', location.href).href;
    const lib = await import(base + 'pdf.min.js');
    lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
    return { lib, base };
  })().catch((e) => { pdfjsLoading = null; throw new Error('The drawing reader could not be loaded — connect to the internet and try again.'); });
  return pdfjsLoading;
}
async function addDrawing(file, pageNo) {
  if (!S.db || !S.assets) { toast('Connect to the shared register first'); return; }
  const say = (txt) => { const m = $('#trkaddmsg'); if (m) m.textContent = txt; };
  try {
    say('Reading the drawing…');
    const bytes = new Uint8Array(await file.arrayBuffer());
    const { lib, base } = await ensurePdfJs();
    const task = lib.getDocument({ data: bytes.slice(), wasmUrl: base + 'wasm/', standardFontDataUrl: base + 'standard_fonts/', iccUrl: base + 'iccs/', isEvalSupported: false });
    const pdf = await task.promise;
    const pn = Math.min(Math.max(1, pageNo || 1), pdf.numPages);
    const page = await pdf.getPage(pn);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(4096 / Math.max(v1.width, v1.height), Math.sqrt(14e6 / (v1.width * v1.height)));
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    say(`Drawing page ${pn} of ${pdf.numPages}…`);
    await page.render({ canvas: cv, canvasContext: cx, viewport: vp, background: 'white' }).promise;
    const img = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.85));
    const [x0, y0, x1, y1] = page.view;
    say('Saving to the shared folder…');
    const upPdf = await S.assets.upload(new Blob([bytes], { type: 'application/pdf' }), { type: 'application/pdf' });
    const upImg = await S.assets.upload(img, { type: 'image/jpeg' });
    const t = { id: 'trk-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: safeName(file.name.replace(/\.pdf$/i, '')) + (pdf.numPages > 1 ? ` (page ${pn})` : ''),
      pdfAsset: upPdf.id, imgAsset: upImg.id, imgW: cv.width, imgH: cv.height, page: pn - 1, vt: Array.from(vp.transform, (n) => +n.toFixed(6)),
      pageW: Math.abs(x1 - x0), pageH: Math.abs(y1 - y0), rotate: page.rotate || 0, addedAt: new Date().toISOString(),
      addedBy: (window.__standalone && window.__standalone.userName && window.__standalone.userName()) || '' };
    try { task.destroy(); } catch (e) {}
    if (await saveProject({ trackers: [...trackers(), t] })) { toast(`Added ${t.name}. Link it to a template, or choose it on the inspection form.`, 5000); render(); }
  } catch (e) { console.error(e); say(''); toast('Could not add that drawing: ' + (e.message || e)); }
}
function trkSetupHtml() {
  if (!TRK_ON) return '';
  const list = trackers();
  return `<h2 style="margin-top:12px" id="trackers">Inspection trackers</h2>
    <section class="sec">
      <p class="hint" style="margin:0">Upload a drawing as a PDF (for example the fence footing plan). Inspectors mark on it where they inspected, and the app keeps a shared tracker PDF with every inspection's date.</p>
      ${list.map((t) => { const n = new Set(trackerMarks(t.id).map((m) => m.rid)).size; return `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:10px">
        <div class="grow"><b>${h(t.name)}</b><div class="hint">${n} inspection${n === 1 ? '' : 's'} marked · added ${h(fmtAU((t.addedAt || '').slice(0, 10)))}${t.addedBy ? ' by ' + h(t.addedBy) : ''}</div></div>
        <button class="btn small" data-trkopen="${h(t.id)}">Open</button><button class="btn small" data-trkren="${h(t.id)}">Rename</button><button class="btn small ghost" data-trkrm="${h(t.id)}">Remove</button></div>`; }).join('')}
      <div id="trkedit"></div>
      <div class="row"><span class="btn primary filebtn">Add drawing (PDF)…<input type="file" id="trkfile" accept="application/pdf,.pdf"></span>
        <label class="f" style="flex-direction:row;align-items:center;gap:8px"><span>Page</span><input class="inp mono" id="trkpage" type="number" min="1" value="1" style="width:72px"></label></div>
      <div class="hint" id="trkaddmsg" aria-live="polite"></div>
    </section>`;
}
function bindTrkSetup() {
  if (!TRK_ON || !$('#trkfile')) return;
  $('#trkfile').onchange = (e) => { const file = e.target.files[0]; e.target.value = ''; if (file) addDrawing(file, +$('#trkpage').value || 1); };
  $$('[data-trkopen]').forEach((b) => { b.onclick = () => openTracker(b.dataset.trkopen, 'view'); });
  $$('[data-trkren]').forEach((b) => { b.onclick = () => {
    const t = trackerById(b.dataset.trkren);
    $('#trkedit').innerHTML = `<div class="card stack"><label class="f"><span>Drawing name</span><input class="inp" id="trkname" value="${h(t.name)}"></label><div class="row"><button class="btn small primary" id="trknsave">Save name</button><button class="btn small ghost" id="trkncancel">Cancel</button></div></div>`;
    $('#trkncancel').onclick = () => { $('#trkedit').innerHTML = ''; };
    $('#trknsave').onclick = async () => { const name = safeName($('#trkname').value); if (!name) return; if (await saveProject({ trackers: trackers().map((x) => (x.id === t.id ? { ...x, name } : x)) })) { toast('Renamed'); render(); } };
  }; });
  $$('[data-trkrm]').forEach((b) => { b.onclick = () => {
    const t = trackerById(b.dataset.trkrm);
    $('#trkedit').innerHTML = `<div class="confirm">Remove ${h(t.name)} from the trackers? Marks stay in the inspection records but won't be shown. <button class="btn small" id="trkry">Remove</button><button class="btn small ghost" id="trkrn">Keep</button></div>`;
    $('#trkrn').onclick = () => { $('#trkedit').innerHTML = ''; };
    $('#trkry').onclick = async () => { if (await saveProject({ trackers: trackers().filter((x) => x.id !== t.id) })) { toast('Removed ' + t.name); render(); } };
  }; });
}

/* --- register tab: list of trackers; detail view card --- */
function viewTrackers() {
  const list = trackers();
  return `<div class="stack">
    <div class="row"><button class="btn ghost small" id="back">← Register</button></div>
    <h2>Inspection trackers</h2>
    ${list.map((t) => { const n = new Set(trackerMarks(t.id).map((m) => m.rid)).size; return `<div class="card stack">
      <div class="row"><b class="grow">${h(t.name)}</b><span class="hint">${n} inspection${n === 1 ? '' : 's'} marked</span></div>
      ${trkPreview(t, null)}
      <div class="row"><button class="btn" data-trkopen="${h(t.id)}">Open drawing</button><button class="btn primary" data-trkpdf="${h(t.id)}">Download tracker PDF</button></div></div>`; }).join('') || '<div class="empty">No drawings yet — add one under Templates › Inspection trackers.</div>'}
  </div>`;
}
function bindTrackers() {
  $('#back').onclick = () => { S.view = 'list'; render(); };
  $$('[data-trkopen]').forEach((b) => { b.onclick = () => openTracker(b.dataset.trkopen, 'view'); });
  $$('[data-trkpdf]').forEach((b) => { b.onclick = () => downloadTracker(b.dataset.trkpdf, b); });
}
function trkDetailHtml(r) {
  if (!TRK_ON) return '';
  const ids = [...new Set((r.marks || []).map((m) => m.t))].filter((id) => trackerById(id));
  return ids.map((id) => { const t = trackerById(id); return `<div class="card stack"><h3><span>Inspection tracker · ${h(t.name)}</span></h3>
    ${trkPreview(t, { rid: r.id, marks: r.marks.filter((m) => m.t === id), date: r.date, reportNo: r.reportNo })}
    <div class="row"><button class="btn" data-trkopen="${h(id)}">Open drawing</button><button class="btn" data-trkpdf="${h(id)}">Download tracker PDF</button></div></div>`; }).join('');
}
function bindTrkDetail(r) {
  $$('#main [data-trkopen]').forEach((b) => { b.onclick = () => openTracker(b.dataset.trkopen, 'view', r.id); });
  $$('#main [data-trkpdf]').forEach((b) => { b.onclick = () => downloadTracker(b.dataset.trkpdf, b); });
}

boot();
setTimeout(() => { ensureZip().catch(() => {}); }, 1500);
</script>
