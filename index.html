<title>Qorilo</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232225" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qorilo">
<meta name="application-name" content="Qorilo">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#EEF3F9;--surface:#FFFFFF;--sunken:#F6F8FB;--ink:#0B2340;--muted:#5B6B80;--line:#D5DEE9;--accent:#0A66E0;--charcoal:#0B2340;--fail:#B42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#081A30;--surface:#0B2340;--sunken:#0F2C4F;--ink:#EAF1FA;--muted:#9FB3CC;--line:#1E3D63;--accent:#2E8BF0;--charcoal:#EAF1FA;--fail:#FF7B70}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Carlito","Calibri","Segoe UI",system-ui,sans-serif}
#lic{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(11,35,64,.10)}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#0A5BD8,#29B6F6)}
.card picture{align-self:center;margin:4px 0 2px}.card img{height:56px;width:auto;display:block;border-radius:6px}
.tag{text-align:center;font-size:13px;margin-top:-8px}
h1{margin:0;font-size:20px;text-align:center;letter-spacing:.02em;color:var(--charcoal)}
#licintro{text-align:center}
p{margin:0;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input{font:inherit;color:var(--ink);min-height:44px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--sunken);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;min-height:44px;border-radius:6px;border:1px solid #0A5BD8;background:linear-gradient(90deg,#0A5BD8,#1E88E5);color:#fff;padding:8px 16px;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--fail)}
.foot{font-size:12px;border-top:1px solid var(--line);padding-top:10px}
.foot b{color:var(--charcoal)}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.row input{width:auto;min-height:0}
</style>
</head>

    <h1>Company sign-in</h1>
    <p id="licintro">Enter your company's username and password.</p>
    <label>Company username<input id="licuser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Company password<input id="licpass" name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="licgo">Continue</button>
    <p id="licmsg" class="err" role="alert" aria-live="assertive"></p>

  </form>
</div>
<script>
(function () {
  'use strict';
  const LS = 'insp.licence', enc = new TextEncoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tob64 = (u) => btoa(String.fromCharCode.apply(null, u));
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  const get = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } };
  const put = (v) => { try { v ? localStorage.setItem(LS, JSON.stringify(v)) : localStorage.removeItem(LS); } catch (e) {} };
  const $ = (id) => document.getElementById(id);
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const uhash = async (user) => hex(await crypto.subtle.digest('SHA-256', enc.encode('site-inspections-licence:' + user.trim().toLowerCase())));
  async function licences() {
    try { const r = await fetch('licences.json', { cache: 'no-store' }); if (r.ok) return { list: await r.json(), live: true }; } catch (e) {}
    try { const c = window.caches && await caches.match('licences.json', { ignoreSearch: true }); if (c) return { list: await c.json(), live: false }; } catch (e) {}
    return null;
  }
  async function unwrap(entry, kekRaw) {
    const kek = await crypto.subtle.importKey('raw', kekRaw, 'AES-GCM', false, ['decrypt']);
    const w = b64(entry.wrap);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12) }, kek, w.slice(12)));
  }
  async function openApp(appKey, lic) {
    const r = await fetch('app.bin'); if (!r.ok) throw new Error('The app could not be downloaded (' + r.status + ').');
    const buf = new Uint8Array(await r.arrayBuffer());
    const key = await crypto.subtle.importKey('raw', appKey, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)));
    window.__licence = { company: lic.name, user: lic.user, exp: lic.exp || '', signOut: () => { put(null); location.replace(location.pathname); } };
    document.open(); document.write(html); document.close();
  }
  function form(msg) {
    $('lic').hidden = false; $('licmsg').textContent = msg || '';
    const prev = get(); if (prev && prev.user) $('licuser').value = prev.user;
    $('licform').onsubmit = async (e) => {
      e.preventDefault();
      const user = $('licuser').value.trim(), pass = $('licpass').value, btn = $('licgo');
      if (!user || !pass) return;
      btn.disabled = true; btn.textContent = 'Checking…'; $('licmsg').textContent = '';
      try {
        const L = await licences();
        if (!L) throw new Error('Connect to the internet to sign in the first time.');
        const u = await uhash(user), entry = (L.list.companies || []).find((c) => c.u === u);
        const salt = entry ? b64(entry.salt) : crypto.getRandomValues(new Uint8Array(16));
        const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
        const kek = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: L.list.iter || 310000 }, base, 256));
        let appKey = null; if (entry) { try { appKey = await unwrap(entry, kek); } catch (x) {} }
        if (!appKey) throw new Error('The company username or password is not right.');
        if (entry.exp && entry.exp < today()) throw new Error(`The licence for ${entry.name} ended on ${entry.exp}. Contact Ali YZ to renew it.`);
        const lic = { user, u, kek: tob64(kek), name: entry.name, exp: entry.exp || '' };
        put(lic); btn.textContent = 'Opening…';
        await openApp(appKey, lic);
      } catch (x) { $('licmsg').textContent = x.message || String(x); btn.disabled = false; btn.textContent = 'Continue'; $('licpass').select(); }
    };
    setTimeout(() => ($('licuser').value ? $('licpass') : $('licuser')).focus(), 50);
  }
  (async () => {
    if (!window.crypto || !crypto.subtle) { form('This browser cannot open the app — use an up-to-date browser over https.'); return; }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    const lic = get();
    if (!lic || !lic.kek) { form(); return; }
    const L = await licences();
    if (!L) { form('Connect to the internet to open the app.'); return; }
    const entry = (L.list.companies || []).find((c) => c.u === lic.u);
    if (!entry) { put({ user: lic.user }); form(`Access for ${lic.name || 'your company'} has ended. Contact Ali YZ.`); return; }
    if (entry.exp && entry.exp < today()) { form(`The licence for ${entry.name} ended on ${entry.exp}. Contact Ali YZ to renew it.`); return; }
    let appKey; try { appKey = await unwrap(entry, b64(lic.kek)); } catch (e) { put({ user: lic.user }); form('Your company password has changed — sign in again.'); return; }
    try { await openApp(appKey, { ...lic, name: entry.name, exp: entry.exp || '' }); }
    catch (e) { form(e.message && /download/.test(e.message) ? e.message : 'The app could not be opened — sign in again.'); }
  })();
})();
</script>
